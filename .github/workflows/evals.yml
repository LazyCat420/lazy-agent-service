name: evals

# Nightly scored evals (scripts/eval/scheduled-evals.mjs). The hosted runner cannot reach the
# deployed service or the vLLM judge, so it runs the offline suites (security, redteam) only.
# The live suites (basic, chaos, harness2) run from the LAN: `npm run eval:scheduled -- --live`.
# The job fails when the pass count drops below the last committed line of
# scripts/eval/history.jsonl for the same suite set; the updated history is uploaded as an artifact.
on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:

concurrency:
  group: evals
  cancel-in-progress: false

jobs:
  scheduled-evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: scheduled evals (security bench, sandbox red-team)
        run: npm run eval:scheduled -- --out .checks/evals
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-history
          path: |
            scripts/eval/history.jsonl
            .checks/evals
