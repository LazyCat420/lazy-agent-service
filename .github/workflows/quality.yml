name: quality

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: verify (typecheck, lint, tests, duplication, architecture, prompt budget)
        run: npm run verify

  quality-report:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: full quality report (CRAP with coverage, dead code)
        run: npm run quality
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-reports
          path: .checks/quality-*
