services:
  lazy-service:
    image: ${IMAGE_NAME:-lazy-agent-service}:latest
    container_name: ${IMAGE_NAME:-lazy-agent-service}
    restart: unless-stopped
    ports:
      - "${PORT:-7778}:7778"
    env_file:
      - .env
    environment:
      - TZ=America/Los_Angeles
      # API_SERVER_KEY comes from env_file (.env); do not pin it here — a
      # hardcoded override published the key and pinned it stale (see the
      # api-server-key-drift incident).
      - CHART_OUTPUT_DIR=/app/data/charts
      - RUNTIME_STORE_PATH=/app/runtime-data/run_store_durable.json
      # The /platform dashboard reads tool_usage_stats from the TRADING
      # database, not the primary one. MONGO_URI comes from the deployed .env.
      - TRADING_MONGO_DB=${TRADING_MONGO_DB:-trading_bot}
      # vLLM nemotron35. :8080 (llama.cpp Bonsai) is gone; see VllmShimService UPSTREAMS.
      - VLLM_SHIM_JETSON_URL=${VLLM_SHIM_JETSON_URL:-http://10.0.0.30:8000}
      # Dell boxes (2026-11-03). vault projects.json defines
      # PROVIDER_VLLM_1..3 (jetson, gold-spark, jetson-2); these add the LAS
      # instances vllm-4 / vllm-5. Both default to the shared `/vllm-shim/qwen`
      # request pool (legacy route name; the model is discovered live, today
      # DeepSeek-V4.1-Flash-1017 on both boxes). Pool membership comes from
      # VLLM_SHIM_POOL_MEMBERS, default `dell2` — the Dells run one TP=2 cluster
      # and only 10.0.0.37 (`dell2`) has an API; set
      # VLLM_SHIM_POOL_MEMBERS=dell2,dell1 when two standalone engines are back.
      # The legacy per-box member routes `/vllm-shim/dell1` and
      # `/vllm-shim/dell2` remain swapped vs physical hosts (`dell1` -> 10.0.0.131
      # dellbox2, `dell2` -> 10.0.0.37 dellbox1). Both vllm-4 and vllm-5 /health checks
      # test pool availability (`pool.members[].up` reports individual Dell status and
      # degrades `/health` when a member drops). trading-service keys its Dell
      # boxes by pool member name, so a member not listed here (dell1 today)
      # leaves its rotation and the Dells' admission budget is the one engine's 5.
      # VLLM_SHIM_POOL_MEMBERS defaults to gold-spark,dell2 so local generation
      # traffic balances across both DeepSeek boxes cleanly while still honoring
      # x-pool-prefer-member pinning for Parallel A/A noise verification.
      - VLLM_SHIM_POOL_MEMBERS=${VLLM_SHIM_POOL_MEMBERS:-gold-spark,dell2}
      - PROVIDER_VLLM_4_URL=${PROVIDER_VLLM_4_URL:-http://10.0.0.16:5591/vllm-shim/qwen}
      - PROVIDER_VLLM_4_NICKNAME=${PROVIDER_VLLM_4_NICKNAME:-Dell pool A}
      - PROVIDER_VLLM_4_CONCURRENCY=${PROVIDER_VLLM_4_CONCURRENCY:-5}
      - PROVIDER_VLLM_5_URL=${PROVIDER_VLLM_5_URL:-http://10.0.0.16:5591/vllm-shim/qwen}
      - PROVIDER_VLLM_5_NICKNAME=${PROVIDER_VLLM_5_NICKNAME:-Dell pool B}
      - PROVIDER_VLLM_5_CONCURRENCY=${PROVIDER_VLLM_5_CONCURRENCY:-5}
      # NAS otel-collector (deploy-kit/infra/observability); unset = tracing off.
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://10.0.0.16:4318}
      # scraper-service on the NAS. The code default (localhost:8001) is this
      # container itself, so the SearXNG search fallback and the scraper
      # extract path were refused (ECONNREFUSED) in production.
      - SCRAPER_SERVICE_URL=${SCRAPER_SERVICE_URL:-http://10.0.0.16:8001}
    volumes:
      - /usr/share/zoneinfo/America/Los_Angeles:/etc/localtime:ro
      - ./data/charts:/app/data/charts
      - ./runtime-data:/app/runtime-data
      - ./projects.json:/app/projects.json:ro

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "-O", "/dev/null", "http://localhost:7778/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 2G
